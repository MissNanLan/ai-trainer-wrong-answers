const KEY="ai-trainer-l3-wrong-v1";

function correctionPanel(q){let c=corrections[q.id],current=correctionChoice||c?.answer||q.answer;return `<div class=correction><h3>纠正本题答案</h3><div class=sub>本次修改仅保存在当前浏览器，并会立即影响判分。</div><div class=correct-options>${["A","B","C","D"].map(k=>`<button class="correct-choice ${current===k?"on":""}" data-correct-key=${k}>${k}</button>`).join("")}</div><textarea id=correctionNote placeholder="更正备注（例如：题库答案有误，教材第×页为B）">${esc(correctionNoteDraft)}</textarea><div class=tools><button id=saveCorrection class=primary>保存更正</button><button id=closeCorrection class=secondary>取消</button></div></div>`}
function render(){stats();document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.filter===filter));let list=filtered();if(!list.length){document.querySelector("#quiz").innerHTML=`<div class=empty>这个分类暂时没有题目。<br><button class=secondary onclick="setFilter('all')">返回全部题</button></div>`;return}if(restorePending&&currentQuestionId!==null){let savedIndex=list.findIndex(item=>item.id===Number(currentQuestionId));if(savedIndex>=0)idx=savedIndex}restorePending=false;idx=Math.max(0,Math.min(idx,list.length-1));let q=list[idx],rec=records[q.id]||{},answer=rec.choice||selected,done=rec.submitted,correctAnswer=effectiveAnswer(q),manual=corrections[q.id];currentQuestionId=q.id;saveProgress();let ops=q.options.map(o=>`<button class="opt ${answer===o.key?"selected":""}" data-key="${o.key}" ${done?"disabled":""}><span class=key>${o.key}</span><span>${o.text}</span></button>`).join("");let fb="",panel="";if(done){let state=rec.correct?"good":"bad";fb=`<div class="feedback ${state}"><b>${rec.correct?"答对了":"这题需要再看"}</b><br>当前答案：<b>${correctAnswer}</b>${manual?"（已手动更正）":""}<br>${q.note}<br><b>记忆点：</b>${q.memory}</div>`;if(manual)fb+=`<div class=manual><b>更正备注：</b>${esc(manual.note||"未填写")}</div>`;panel=editingCorrection?correctionPanel(q):`<div class=tools><button id=editCorrection class=secondary>${manual?"修改本题更正":"纠正本题答案"}</button>${manual?"<button id=removeCorrection class=secondary>撤销更正</button>":""}</div>`}document.querySelector("#quiz").innerHTML=`<div class=meta><span class=badge>${q.topic}</span><span>${idx+1} / ${list.length}（题号 ${q.id}）</span></div><p class=stem>${q.stem}</p><div class=options>${ops}</div><label class=uncertain><input id=uncertain type=checkbox ${rec.uncertain?"checked":""} ${done?"disabled":""}> 我对这题不确定，加入重点复习</label>${done?"":`<div class=tools><button id=submit class=primary ${answer?"":"disabled"}>提交并看解析</button></div>`}${fb}${panel}<div class=nav><button id=prev ${idx===0?"disabled":""}>← 上一题</button><button id=next ${idx===list.length-1?"disabled":""}>下一题 →</button></div>`;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{selected=b.dataset.key;render()});let un=document.querySelector("#uncertain");if(un)un.onchange=()=>{let x=records[q.id]||{};x.uncertain=un.checked;records[q.id]=x;saveRecords();stats()};let s=document.querySelector("#submit");if(s)s.onclick=()=>{let x=records[q.id]||{};x.choice=selected;x.submitted=true;x.correct=selected===correctAnswer;x.uncertain=document.querySelector("#uncertain").checked;records[q.id]=x;saveRecords();render()};let edit=document.querySelector("#editCorrection");if(edit)edit.onclick=()=>{editingCorrection=true;correctionChoice=manual?.answer||q.answer;correctionNoteDraft=manual?.note||"";render()};document.querySelectorAll(".correct-choice").forEach(b=>b.onclick=()=>{let note=document.querySelector("#correctionNote");if(note)correctionNoteDraft=note.value;correctionChoice=b.dataset.correctKey;render()});let note=document.querySelector("#correctionNote");if(note)note.oninput=()=>correctionNoteDraft=note.value;let save=document.querySelector("#saveCorrection");if(save)save.onclick=()=>{corrections[q.id]={answer:correctionChoice,note:correctionNoteDraft.trim(),updatedAt:new Date().toISOString()};saveCorrections();rescore();editingCorrection=false;selected=null;render()};let close=document.querySelector("#closeCorrection");if(close)close.onclick=()=>{editingCorrection=false;render()};let remove=document.querySelector("#removeCorrection");if(remove)remove.onclick=()=>{delete corrections[q.id];saveCorrections();rescore();selected=null;render()};document.querySelector("#prev").onclick=()=>{idx--;selected=null;editingCorrection=false;render()};document.querySelector("#next").onclick=()=>{idx++;selected=null;editingCorrection=false;render()}}

document.querySelector("#exportBtn").onclick=()=>{let rows=questions.map(q=>{let c=corrections[q.id],r=records[q.id];return {题号:q.id,知识点:q.topic,题库原答案:q.answer,当前生效答案:effectiveAnswer(q),已手动更正:c?"是":"否",更正备注:c?.note||"",我的作答:r?.choice||"",结果:r?.submitted?(r.correct?"正确":"错误"):"未作答",不确定:r?.uncertain?"是":"否"}});let blob=new Blob([JSON.stringify(rows,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="人工智能训练师三级_学习与更正记录.json";a.click();URL.revokeObjectURL(a.href)};
