<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>人工智能训练师三级｜判断题库</title>
<style>
:root{--ink:#13233a;--blue:#2563eb;--pale:#eff6ff;--bg:#f5f7fb;--red:#b42318;--green:#067647}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}.app{max-width:680px;margin:auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}header{padding:4px 2px 16px}h1{font-size:23px;margin:0 0 7px}.sub{color:#63738a;font-size:14px;line-height:1.5}.modes,.filters,.tools,.nav,.footer{display:flex;gap:8px;flex-wrap:wrap}.modes{margin:8px 0 16px}.mode,.chip,.secondary,.primary,.stat,.jump input,.jump button{font:inherit;border:1px solid #d7e0ed;border-radius:12px;padding:10px 13px;background:#fff;color:#40526d}.mode{font-weight:700}.mode.on,.chip.on,.primary{background:var(--blue);border-color:var(--blue);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}.stat{padding:11px 4px;font-size:11px}.stat b{display:block;font-size:20px;color:var(--ink);margin-bottom:3px}.filters{overflow:auto;flex-wrap:nowrap;padding:2px 0 15px}.chip{border-radius:999px;white-space:nowrap}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 28px #173b6d12}.meta{display:flex;justify-content:space-between;gap:8px;color:#65758b;font-size:13px;margin-bottom:14px}.badge{background:#dbeafe;color:#1d4ed8;border-radius:99px;padding:3px 8px}.stem{font-size:18px;line-height:1.65;font-weight:700;margin:0 0 16px}.options{display:grid;gap:10px}.opt{width:100%;display:flex;gap:11px;align-items:flex-start;text-align:left;border:1px solid #d9e1ec;background:#fff;border-radius:13px;padding:13px;font:inherit;color:var(--ink);line-height:1.45}.key{flex:0 0 25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#edf2f7;color:#42536a;font-weight:700}.opt.selected{border:2px solid var(--blue);background:var(--pale)}.opt.selected .key{background:var(--blue);color:#fff}.primary{font-weight:700;flex:1}.primary:disabled{background:#9fb8ef;border-color:#9fb8ef}.uncertain{display:flex;gap:8px;margin:16px 0;color:#55657b}.feedback,.correction,.manual{margin-top:16px;border-radius:14px;padding:14px;line-height:1.6;background:#f8fafc;border-left:4px solid var(--blue)}.feedback.good{border-left-color:var(--green);background:#f0fdf4}.feedback.bad{border-left-color:var(--red);background:#fff5f5}.correction{border:1px solid #bfdbfe;border-left:1px solid #bfdbfe;background:#f0f7ff}.manual{border-left:0;background:#fff7e6;color:#7a4e00}.nav{justify-content:space-between;margin-top:14px}.nav button,.footer button{border:0;background:transparent;color:var(--blue);font:inherit;font-weight:700;padding:9px}.jump{display:flex;gap:6px;align-items:center;margin:0 0 14px}.jump input{width:86px;padding:9px}.jump button{padding:9px 11px}.footer{justify-content:center;margin-top:17px}.empty{text-align:center;padding:32px 8px;color:#63738a}.hidden{display:none}.correction h3{margin:0 0 8px;font-size:16px}.correct-options{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.correct-choice{border:1px solid #b8c8df;background:#fff;border-radius:9px;padding:9px 4px;font:inherit;font-weight:700;color:#36506f}.correct-choice.on{background:var(--blue);color:#fff;border-color:var(--blue)}textarea{width:100%;min-height:70px;border:1px solid #b8c8df;border-radius:10px;padding:10px;font:inherit;resize:vertical}@media(max-width:390px){.app{padding-left:12px;padding-right:12px}.card{padding:16px}.stats{gap:5px}.stat b{font-size:18px}}
</style>
<body><main class="app">
<header><h1>三级判断题库</h1><div class="sub" id="subtitle">正在载入 1–300 题…</div><div class="sub"><a href="index.html">切换到单选题</a></div></header>
<nav class="modes" id="modes"><button class="mode on" data-mode="full">完整题库</button><button class="mode" data-mode="wrong">错题集</button></nav>
<section class="stats" id="stats"></section>
<nav class="filters" id="filters"><button class="chip on" data-filter="all">全部题</button><button class="chip" data-filter="uncertain">不确定题</button><button class="chip" data-filter="unanswered">未作答</button></nav>
<section class="card"><div class="jump"><label>跳转题号 <input id="jumpInput" inputmode="numeric" type="number" min="1" max="300"></label><button id="jumpBtn">跳转</button></div><div id="quiz">正在载入题库…</div></section>
<div class="footer"><button id="exportBtn">导出学习记录</button><button id="resetBtn">清空本机记录</button></div>
</main><script>
const KEY="ai-trainer-l3-judgement-v1";
const initialWrongIds=new Set();
let questions=[],records=JSON.parse(localStorage.getItem(KEY+":records")||"{}"),wrongRecords=JSON.parse(localStorage.getItem(KEY+":wrong-records")||"{}"),corrections=JSON.parse(localStorage.getItem(KEY+":corrections")||"{}"),progress=JSON.parse(localStorage.getItem(KEY+":progress")||"{}"),mode="full",filter="all",idx=0,selected=null,editing=false,correctionChoice=null,correctionNote="";
let wrongQuestionIds=new Set(JSON.parse(localStorage.getItem(KEY+":wrong-questions")||"[]")),removedWrongQuestionIds=new Set(JSON.parse(localStorage.getItem(KEY+":removed-wrong-questions")||"[]"));
Object.entries(records).forEach(([id,record])=>{if(record?.submitted&&!record.correct&&!removedWrongQuestionIds.has(Number(id)))wrongQuestionIds.add(Number(id))});
const save=()=>{localStorage.setItem(KEY+":records",JSON.stringify(records));localStorage.setItem(KEY+":wrong-records",JSON.stringify(wrongRecords));localStorage.setItem(KEY+":corrections",JSON.stringify(corrections));localStorage.setItem(KEY+":progress",JSON.stringify(progress));localStorage.setItem(KEY+":wrong-questions",JSON.stringify([...wrongQuestionIds]));localStorage.setItem(KEY+":removed-wrong-questions",JSON.stringify([...removedWrongQuestionIds]))};
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const answer=q=>corrections[q.id]?.answer||q.answer;
const activeRecords=()=>mode==="wrong"?wrongRecords:records;
const candidates=()=>questions.filter(q=>mode==="full"||((initialWrongIds.has(q.id)||wrongQuestionIds.has(q.id))&&!removedWrongQuestionIds.has(q.id)));
const list=()=>{let currentRecords=activeRecords();return candidates().filter(q=>filter==="all"||filter==="uncertain"&&currentRecords[q.id]?.uncertain||filter==="unanswered"&&!currentRecords[q.id]?.submitted)};
function rescore(){[records,wrongRecords].forEach(recordSet=>questions.forEach(q=>{if(recordSet[q.id]?.submitted){recordSet[q.id].correct=recordSet[q.id].choice===answer(q);if(!recordSet[q.id].correct&&!removedWrongQuestionIds.has(q.id))wrongQuestionIds.add(q.id)}}));save()}
function selectMode(next){mode=next;let p=progress[mode]||{};const validFilters=mode==="full"?["all","uncertain","unanswered"]:["all","uncertain","unanswered"];filter=validFilters.includes(p.filter)?p.filter:"all";idx=0;selected=null;editing=false;document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));render()}
function saveProgress(id){progress[mode]={filter,questionId:id};save()}
function stats(){let currentRecords=activeRecords(),source=candidates(),done=source.filter(q=>currentRecords[q.id]?.submitted),wrong=done.filter(q=>!currentRecords[q.id].correct),unc=source.filter(q=>currentRecords[q.id]?.uncertain);document.querySelector("#stats").innerHTML=`<button class=stat data-filter=all><b>${source.length}</b>总题</button><button class=stat data-filter=all><b>${done.length}</b>已答</button><button class=stat data-open-mode=wrong><b>${wrong.length}</b>错题</button><button class=stat data-filter=uncertain><b>${unc.length}</b>不确定</button>`;document.querySelectorAll(".stat").forEach(b=>b.onclick=()=>{if(b.dataset.openMode){filter="all";selectMode("wrong");return}filter=b.dataset.filter;idx=0;render()})}
function correctionPanel(q){let current=correctionChoice||corrections[q.id]?.answer||q.answer;return `<div class=correction><h3>纠正本题答案</h3><div class=sub>仅保存在当前浏览器，并会同时影响完整题库和错题集的判分。</div><div class=correct-options>${["√","×"].map(k=>`<button class="correct-choice ${current===k?"on":""}" data-correct=${k}>${k}</button>`).join("")}</div><textarea id=correctionNote placeholder="更正备注（可选）">${esc(correctionNote)}</textarea><div class=tools><button class=primary id=saveCorrection>保存更正</button><button class=secondary id=cancelCorrection>取消</button></div></div>`}
function moveQuestion(delta){if(progress[mode])delete progress[mode].questionId;idx+=delta;selected=null;editing=false;render()}
function render(){if(!questions.length)return;stats();document.querySelector("#subtitle").textContent=`${mode==="full"?"判断题库 1–300 题":"判断错题集：实际答错题"}｜离线记录保存在本机`;document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b.dataset.filter===filter));let data=list(),saved=progress[mode]?.questionId;if(saved){let n=data.findIndex(q=>q.id===saved);if(n>=0)idx=n;delete progress[mode].questionId}if(!data.length){document.querySelector("#quiz").innerHTML=`<div class=empty>这个分类暂时没有题目。<br><button class=secondary id=backAll>返回全部题</button></div>`;document.querySelector("#backAll").onclick=()=>{filter="all";render()};return}idx=Math.max(0,Math.min(idx,data.length-1));let q=data[idx],currentRecords=activeRecords(),r=currentRecords[q.id]||{},chosen=r.choice||selected,done=r.submitted,correctAnswer=answer(q),manual=corrections[q.id];saveProgress(q.id);let options=["√","×"].map(key=>`<button class="opt ${chosen===key?"selected":""}" data-key=${key} ${done?"disabled":""}><span class=key>${key}</span><span>${key==="√"?"正确":"错误"}</span></button>`).join("");let feedback="",panel="",wrongAction=mode==="wrong"?'<div class=tools><button class=secondary id=removeWrongQuestion>移出错题集</button></div>':"";if(done){feedback=`<div class="feedback ${r.correct?"good":"bad"}"><b>${r.correct?"答对了":"这题需要再看"}</b><br>当前答案：<b>${correctAnswer}</b>${manual?"（已手动更正）":""}<br>${esc(q.note)}<br><b>记忆点：</b>${esc(q.memory)}</div>`;if(manual)feedback+=`<div class=manual><b>更正备注：</b>${esc(manual.note||"未填写")}</div>`;panel=editing?correctionPanel(q):`<div class=tools><button class=secondary id=editCorrection>${manual?"修改本题更正":"纠正本题答案"}</button>${manual?'<button class=secondary id=removeCorrection>撤销更正</button>':""}</div>`}document.querySelector("#quiz").innerHTML=`<div class=meta><span class=badge>题号 ${q.id}</span><span>${idx+1} / ${data.length}</span></div><p class=stem>${esc(q.stem)}</p><div class=options>${options}</div><label class=uncertain><input id=uncertain type=checkbox ${r.uncertain?"checked":""} ${done?"disabled":""}> 我对这题不确定，加入重点复习</label>${feedback}${panel}${wrongAction}<div class=nav><button id=prev ${idx===0?"disabled":""}>← 上一题</button><button id=next ${idx===data.length-1?"disabled":""}>下一题 →</button></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;let choice=b.dataset.key;currentRecords[q.id]={...r,choice,submitted:true,correct:choice===correctAnswer,uncertain:document.querySelector("#uncertain").checked};if(!currentRecords[q.id].correct){removedWrongQuestionIds.delete(q.id);wrongQuestionIds.add(q.id)}selected=null;save();render()});let uncertain=document.querySelector("#uncertain");if(uncertain)uncertain.onchange=()=>{currentRecords[q.id]={...r,uncertain:uncertain.checked};save();stats()};let edit=document.querySelector("#editCorrection");if(edit)edit.onclick=()=>{editing=true;correctionChoice=manual?.answer||q.answer;correctionNote=manual?.note||"";render()};document.querySelectorAll("[data-correct]").forEach(b=>b.onclick=()=>{correctionChoice=b.dataset.correct;render()});let note=document.querySelector("#correctionNote");if(note)note.oninput=()=>correctionNote=note.value;let saveCorrection=document.querySelector("#saveCorrection");if(saveCorrection)saveCorrection.onclick=()=>{corrections[q.id]={answer:correctionChoice,note:correctionNote.trim(),updatedAt:new Date().toISOString()};editing=false;selected=null;rescore();render()};let cancel=document.querySelector("#cancelCorrection");if(cancel)cancel.onclick=()=>{editing=false;render()};let remove=document.querySelector("#removeCorrection");if(remove)remove.onclick=()=>{delete corrections[q.id];rescore();render()};let removeWrongQuestion=document.querySelector("#removeWrongQuestion");if(removeWrongQuestion)removeWrongQuestion.onclick=()=>{if(confirm("确定将本题移出错题集吗？完整题库记录与答案更正不会受影响。")){removedWrongQuestionIds.add(q.id);wrongQuestionIds.delete(q.id);delete wrongRecords[q.id];save();idx=0;selected=null;render()}};document.querySelector("#prev").onclick=()=>moveQuestion(-1);document.querySelector("#next").onclick=()=>moveQuestion(1)}
document.querySelector("#modes").onclick=e=>{if(e.target.dataset.mode)selectMode(e.target.dataset.mode)};document.querySelector("#filters").onclick=e=>{if(e.target.dataset.filter){filter=e.target.dataset.filter;idx=0;render()}};document.querySelector("#jumpBtn").onclick=()=>{let id=Number(document.querySelector("#jumpInput").value),data=list(),n=data.findIndex(q=>q.id===id);if(n<0)return alert(mode==="wrong"?"该题目前不在错题集中。":"请输入当前范围内的题号。");idx=n;render()};document.querySelector("#exportBtn").onclick=()=>{let rows=questions.map(q=>({题号:q.id,题库原答案:q.answer,当前生效答案:answer(q),已手动更正:corrections[q.id]?"是":"否",更正备注:corrections[q.id]?.note||"",我的作答:records[q.id]?.choice||"",结果:records[q.id]?.submitted?(records[q.id].correct?"正确":"错误"):"未作答",不确定:records[q.id]?.uncertain?"是":"否"}));let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:"application/json"}));a.download="人工智能训练师三级_判断题学习记录.json";a.click();URL.revokeObjectURL(a.href)};document.querySelector("#resetBtn").onclick=()=>{if(confirm("确定清空本机作答记录与进度吗？手动答案更正和错题集会保留。")){records={};wrongRecords={};progress={};save();idx=0;selected=null;render()}};
fetch("judgement-bank-300.json").then(r=>r.ok?r.json():Promise.reject()).then(data=>{questions=data;rescore();selectMode("full")}).catch(()=>{document.querySelector("#quiz").innerHTML="<div class=empty>判断题数据加载失败，请确认 judgement-bank-300.json 与网页在同一目录。</div>"});
</script></body></html>
